appId: com.redvulps.colorixer
name: The full-screen button shows the palette over the whole screen, and a tap closes it
---
- launchApp:
    clearState: true

- tapOn:
    id: 'fullscreen-button'
- assertVisible:
    id: 'palette-fullscreen'
- assertVisible: 'Analogous · 5 colors'

- tapOn:
    id: 'palette-fullscreen'
- assertNotVisible:
    id: 'palette-fullscreen'
- assertVisible:
    id: 'harmony-selector'
