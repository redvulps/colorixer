appId: com.redvulps.colorixer
name: Harmony types generate the expected palette for the default red
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible:
    id: 'harmony-selector'

# Analogous (default): the base and ±18° / ±36° on the RYB wheel
- assertVisible: '#ff0000'
- assertVisible: '#ff002d'
- assertVisible: '#ff2600'

# Complementary on the RYB wheel: red's partner is green, not cyan
- tapOn:
    id: 'harmony-complementary'
- assertVisible: '#00ff4d'
- assertVisible: '#bf3030'
- assertNotVisible: '#ff2600'

- tapOn:
    id: 'harmony-triadic'
- assertVisible: '#007bff'
- assertVisible: '#ffff00'
- assertNotVisible: '#00ff4d'

- tapOn:
    id: 'harmony-square'
- assertVisible: '#6600ff'
- assertVisible: '#ffbf00'

# The strip scrolls to show the last harmonies
- swipe:
    from:
      id: 'harmony-selector'
    direction: LEFT
- tapOn:
    id: 'harmony-shades'
- assertVisible: '#db0000'
- assertVisible: '#610000'

- tapOn:
    id: 'harmony-monochromatic'
- assertVisible: '#cc2929'
- assertVisible: '#993d3d'
- assertNotVisible: '#610000'
