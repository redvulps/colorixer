appId: com.redvulps.colorixer
name: Harmony types generate the expected palette for the default red
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible:
    id: 'harmony-selector'

# Analogous (default): base color plus ±30° / ±60° hue steps
- assertVisible: '#ff0000'
- assertVisible: '#ff8000'
- assertVisible: '#ff0080'

- tapOn:
    id: 'harmony-triadic'
- assertVisible: '#00ff00'
- assertVisible: '#0000ff'
- assertNotVisible: '#ff8000'

- tapOn:
    id: 'harmony-complementary'
- assertVisible: '#ff0000'
- assertVisible: '#00ffff'
- assertNotVisible: '#00ff00'

- tapOn:
    id: 'harmony-tetratriadic'
- assertVisible: '#80ff00'
- assertVisible: '#00ffff'
- assertVisible: '#7f00ff'

- tapOn:
    id: 'harmony-monochromatic'
- assertVisible: '#ff0000'
- assertVisible: '#ff3721'
- assertNotVisible: '#80ff00'
