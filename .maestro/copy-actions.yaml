appId: com.redvulps.colorixer
name: Swatches copy their color as HEX, HSL or HSV from the long-press sheet
---
- launchApp:
    clearState: true

# Long press opens the copy actions; Cancel closes them without copying
- longPressOn:
    id: 'swatch-#ff0000'
- assertVisible: 'Copy as HEX'
- assertVisible: 'Copy as HSL'
- assertVisible: 'Copy as HSV'
- tapOn: 'Cancel'
- assertNotVisible: 'Copy as HEX'

# Long press > Copy as HEX
- longPressOn:
    id: 'swatch-#ff8000'
- tapOn: 'Copy as HEX'
- assertVisible: 'Copied #ff8000'
- runFlow:
    when:
      platform: Android
    file: subflows/android-assert-clipboard.yaml
    env:
      CLIPBOARD_TEXT: '#ff8000'

# Long press > Copy as HSL
- longPressOn:
    id: 'swatch-#ff0000'
- tapOn: 'Copy as HSL'
- assertNotVisible: 'Copy as HEX'
- runFlow:
    when:
      platform: Android
    file: subflows/android-assert-clipboard.yaml
    env:
      CLIPBOARD_TEXT: 'hsl\(0deg 100% 50%\)'

# Long press > Copy as HSV
- longPressOn:
    id: 'swatch-#ff0000'
- tapOn: 'Copy as HSV'
- assertNotVisible: 'Copy as HEX'
- runFlow:
    when:
      platform: Android
    file: subflows/android-assert-clipboard.yaml
    env:
      CLIPBOARD_TEXT: 'hsv\(0, 100%, 100%\)'
