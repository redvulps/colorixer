appId: com.redvulps.colorixer
name: Export sheet shares the palette as ASE and Procreate swatches
---
- launchApp:
    clearState: true
- tapOn:
    id: 'share-button'
- assertVisible: 'Current palette'
- assertVisible: 'Export to Procreate'
- assertVisible: 'Export to Adobe'
- tapOn: 'Cancel'
- assertNotVisible: 'Export to Procreate'

# Each export writes a file named after the palette and opens the system share sheet
- tapOn:
    id: 'share-button'
- tapOn: 'Export to Adobe'
- runFlow:
    when:
      platform: Android
    file: subflows/android-assert-share-sheet.yaml
    env:
      FILE_NAME: 'Colorixer palette\.ase'
- assertNotVisible: 'Export to Adobe'

- tapOn:
    id: 'share-button'
- tapOn: 'Export to Procreate'
- runFlow:
    when:
      platform: Android
    file: subflows/android-assert-share-sheet.yaml
    env:
      FILE_NAME: 'Colorixer palette\.swatches'
- assertNotVisible: 'Export to Procreate'
