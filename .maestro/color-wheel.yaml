appId: com.redvulps.colorixer
name: Tapping the color wheel changes the base color
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: '#ff0000'
# Below the center: hue ~90° (yellow-green). Red (0°) is to the right.
- tapOn:
    id: 'color-wheel'
    point: '50%,85%'
- assertNotVisible: '#ff0000'
