appId: com.redvulps.colorixer
name: Typing H, S and V values, or H, S and L, sets the base color
---
- launchApp:
    clearState: true
- assertVisible: '#ff0000'

- tapOn:
    id: 'value-h'
- eraseText
- inputText: '120'
- pressKey: Enter
- assertVisible: '#00ff00'

- tapOn:
    id: 'value-v'
- eraseText
- inputText: '50'
- pressKey: Enter
- assertVisible: '#008000'

# The HSL switch swaps V for L and keeps the color
- tapOn:
    id: 'slider-mode-hsl'
- assertVisible: 'Hue, saturation, lightness'
- tapOn:
    id: 'value-l'
- eraseText
- inputText: '50'
- pressKey: Enter
- assertVisible: '#00ff00'
